function stop(){if(cur){try{cur.rec.stop()}catch(e){}}}
function listen(inp,btn,lang,second){
 const kind=/^(ed|x_d)$/.test(inp.id)?'date':'name',digits=/^(es_|x_s)$/.test(inp.id);
 let rec;try{rec=new SR()}catch(e){return}
 rec.lang=lang;rec.interimResults=true;rec.continuous=false;rec.maxAlternatives=3;
 const me={rec,inp,btn};cur=me;btn.classList.add('on');hint(inp,'শুনছি…');
 let heard='',final=false,err='';
 rec.onresult=e=>{let t='';final=false;for(let i=0;i<e.results.length;i++){t+=(i?' ':'')+e.results[i][0].transcript;if(e.results[i].isFinal)final=true}
  heard=t;if(!final)hint(inp,'শুনছি: '+t);
  else{
   if(kind==='name'){const v=cleanName(t,digits);if(v){inp.value=v;fire(inp);hint(inp,'শুনেছি: '+t)}else hint(inp,'শুনেছি: '+t+' — বোঝা যায়নি, আবার বলুন')}
   else{let alt=null;for(let k=0;k<e.results[e.results.length-1].length&&!alt;k++){const p=parseDob(e.results[e.results.length-1][k].transcript);if(p&&p.iso)alt=p}
    const p=alt||parseDob(t);
    if(p&&p.iso){inp.value=p.iso;fire(inp);hint(inp,'বুঝেছি: '+p.disp+(p.warn?' ⚠ বয়স ৩–২৫ বছরের বাইরে, তারিখ দেখে নিন':''))}

 rec.onerror=e=>{err=e.error;if(err==='not-allowed'||err==='service-not-allowed')hint(inp,'মাইকের অনুমতি দিন (ব্রাউজারের সেটিংসে)');else if(err==='no-speech')hint(inp,'কিছু শোনা যায়নি, আবার চাপুন');else if(err==='network')hint(inp,'ইন্টারনেট দরকার');else if(err!=='aborted')hint(inp,'মাইক কাজ করেনি, আবার চেষ্টা করুন')};
 rec.onend=()=>{btn.classList.remove('on');if(cur===me)cur=null;
  if(me.retry&&kind==='date'&&!err){setTimeout(()=>{hint(inp,'বাংলায় আবার শুনছি… বলুন');listen(inp,btn,'bn-IN',true)},150)}};
 try{rec.start()}catch(e){btn.classList.remove('on');cur=null}}
function addMic(inp){

<script>
/* ===== ইভেন্ট নাম বদল: "ফুটবল ছোড়া" → "বল ছোঁড়া" (পুরনো ডেটা ও পুরনো এক্সেলের জন্য) ===== */
(function(){
const OLD=['ফুটবল ছোড়া','ফুটবল ছোঁড়া'],NEW='বল ছোঁড়া';
window.EVN=v=>OLD.includes(v)?NEW:v;
function walk(o){let c=0;
 if(Array.isArray(o)){for(let i=0;i<o.length;i++){const v=o[i];if(typeof v==='string'){if(OLD.includes(v)){o[i]=NEW;c++}}else if(v&&typeof v==='object')c+=walk(v)}}
 else if(o&&typeof o==='object'){for(const k of Object.keys(o)){const v=o[k];
  if(typeof v==='string'){if(OLD.includes(v)){o[k]=NEW;c++}}else if(v&&typeof v==='object')c+=walk(v);
  if(OLD.includes(k)){if(!(NEW in o))o[NEW]=o[k];delete o[k];c++}}}
 return c}
let LD=null;const D0=window.draw;
window.draw=function(){
 try{if(typeof DB!=='undefined'&&DB&&DB!==LD){LD=DB;if(walk(DB))sv()}}catch(e){console.error(e)}
 return D0.apply(this,arguments)};
})();
</script>
<script>
/* ===== জন্ম তারিখ: লিখে দেওয়ার ঘর (ক্যালেন্ডার ও 🎤 আগের মতোই) ===== */
(function(){
const BD='০১২৩৪৫৬৭৮৯',norm=t=>String(t||'').replace(/[০-৯]/g,d=>BD.indexOf(d)),
 fmt=iso=>{const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(iso||'');return m?m[3]+'/'+m[2]+'/'+m[1]:''},
 complete=t=>{const n=norm(t).trim();return /^\d{8}$/.test(n)||/(^|\D)\d{4}$/.test(n)&&/\D/.test(n)};
let syncing=false;
const fire=d=>{syncing=true;try{d.dispatchEvent(new Event('input',{bubbles:true}));d.dispatchEvent(new Event('change',{bubbles:true}))}finally{syncing=false}};
function setup(d){
 if(!d||d.dataset.dtx)return;d.dataset.dtx=1;
 const t=document.createElement('input');t.type='text';t.id=d.id+'_t';t.setAttribute('inputmode','numeric');t.autocomplete='off';t.placeholder='দিন/মাস/বছর, যেমন 03/05/2026';t.value=fmt(d.value);
 const h=document.createElement('div');h.style.cssText='font-size:12px;margin:-4px 0 6px;display:none';
 const anchor=d.closest('.micw')||d;anchor.parentNode.insertBefore(t,anchor);anchor.parentNode.insertBefore(h,anchor);
 const say=(m,k)=>{h.textContent=m||'';h.style.display=m?'block':'none';h.style.color=k==='err'?'#ff6b6b':k==='warn'?'#ffb74d':'#8fc98f'};
 const apply=final=>{
  const raw=t.value.trim();
  if(!raw){if(d.value){d.value='';fire(d)}say('');return}
  if(!final&&!complete(raw))return;
  const p=typeof window.parseDob==='function'?window.parseDob(raw):null;
  if(p&&p.iso){d.value=p.iso;fire(d);if(final)t.value=fmt(p.iso);say('বুঝেছি: '+p.disp+(p.warn?' ⚠ বয়স ৩–২৫ বছরের বাইরে, তারিখ দেখে নিন':''),p.warn?'warn':'ok')}
  else if(final)say(p&&p.err==='future'?'ভবিষ্যতের তারিখ হতে পারে না':'তারিখ বোঝা যায়নি। যেমন: 03/05/2026','err')};
 t.addEventListener('input',()=>apply(false));
 t.addEventListener('blur',()=>apply(true));
 t.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();apply(true)}});
 const back=()=>{if(syncing)return;t.value=fmt(d.value);if(!d.value)say('')};
 d.addEventListener('input',back);d.addEventListener('change',back)}
const AF=window.afterDraw;
window.afterDraw=function(){AF.apply(this,arguments);try{if(TAB==='entry'&&ME&&!ME.locked)setup(document.getElementById('ed'))}catch(e){console.error(e)}};
const EA0=window.editA;
if(typeof EA0==='function')window.editA=function(){const r=EA0.apply(this,arguments);try{setup(document.getElementById('x_d'))}catch(e){console.error(e)}return r};
})();
</script>
<script>
/* ===== জন্ম তারিখ (এক্সেল): DD/MM/YYYY টেক্সট ধরন, আপলোডে সব ফরম্যাট বুঝে YYYY-MM-DD ===== */
(function(){
window.fmtDob=iso=>{const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(String(iso||''));return m?m[3]+'/'+m[2]+'/'+m[1]:String(iso||'')};
window.normDob=function(v){
 v=String(v==null?'':v).trim();if(!v)return{iso:''};
 let iso=null;
 if(/^\d{5}(\.\d+)?$/.test(v)){const n=Math.floor(+v);if(n>20000&&n<80000)iso=new Date(Math.round((n-25569)*864e5)).toISOString().slice(0,10)}
 if(!iso){const p=typeof window.parseDob==='function'?window.parseDob(v):null;
  if(p&&p.iso)iso=p.iso;else if(p&&p.err==='future')return{err:'ভবিষ্যতের তারিখ'};else return{err:'তারিখ বোঝা যায়নি'}}
 if(new Date(iso)>new Date())return{err:'ভবিষ্যতের তারিখ'};
 return{iso}};
})();
</script>
<script>
/* ===== ইভেন্ট ও প্রতিযোগী-তালিকার একটাই স্থায়ী ক্রম ===== */
(function(){
const ORD=['৭৫ মি. দৌড়','১০০ মি. দৌড়','২০০ মি. দৌড়','শাটল দৌড়','দীর্ঘ লম্ফন','উচ্চ লম্ফন','যোগাসন','জিমন্যাস্টিক্স','বল ছোঁড়া','অঙ্কন','আবৃত্তি','১০০ মি. দৌড় (শিক্ষক)','চামচ-গুলি দৌড় (শিক্ষিকা)'];
const rank=e=>{const i=ORD.indexOf(e);return i<0?999:i};
window.evSort=arr=>{const u=[...new Set(Array.isArray(arr)?arr:[])].map((e,i)=>[e,i]);u.sort((p,q)=>rank(p[0])-rank(q[0])||p[1]-q[1]);return u.map(x=>x[0])};
const CK={boys:0,girls:1,cult:2,teach:3};
window.pCmp=(x,y)=>{
 const c=(x.cat in CK?CK[x.cat]:9)-(y.cat in CK?CK[y.cat]:9);if(c)return c;
 const s=String(x.sec||'').localeCompare(String(y.sec||''));if(s)return s;
 const e=rank((x.ev||[])[0])-rank((y.ev||[])[0]);if(e)return e;
 return String(x.name||'').localeCompare(String(y.name||''))};
/* প্রতিটি আঁকার আগে প্রতিযোগীর ev স্থায়ী ক্রমে সাজাও (নতুন এন্ট্রি, এডিট, বাল্ক, আগের ডেটা, ব্যাকআপ ফেরত — সবই এখান দিয়ে যায়) */
const D0=window.draw;
window.draw=function(){
 try{if(typeof DB!=='undefined'&&DB&&Array.isArray(DB.a)){let ch=false;
  DB.a.forEach(x=>{if(Array.isArray(x.ev)){const s=window.evSort(x.ev);if(s.length!==x.ev.length||s.some((e,i)=>e!==x.ev[i])){x.ev=s;ch=true}}});
  if(ch)sv()}}catch(e){console.error(e)}
 return D0.apply(this,arguments)};
})();
</script>
<script>
/* ===== চেস্ট কার্ড: ফাইনালাইজ/আনলক, ক্রম, নম্বর তৈরির নতুন নিয়ম ===== */
(function(){
const ADMR=['gp','circle','sub'],isAdm=()=>!!ME&&ADMR.includes(ME.role),bdg=v=>String(v).replace(/[০-৯]/g,d=>'০১২৩৪৫৬৭৮৯'.indexOf(d));
/* পিন চাইবে (লগইনের H()/ME.pin পদ্ধতিতেই) */
window.askPin=function(msg,cb){
 $('mb').innerHTML='<h2>পিন দিন</h2><p>'+msg+'</p><input id="apin" type="password" autocomplete="off" placeholder="আপনার পিন"><p id="apm" style="color:#ff8b8f;margin:4px 0"></p><button class="b p" id="apy">নিশ্চিত</button><button class="b" id="apn">বাতিল</button>';
 $('md').style.display='flex';$('apn').onclick=()=>$('md').style.display='none';
 $('apy').onclick=async()=>{const v=$('apin').value;let ok=false;try{for(const c of [v,v.trim(),bdg(v),bdg(v).trim()]){if(ME.pin===await H(c)){ok=true;break}}}catch(e){}
  if(!ok){$('apm').textContent='পিন সঠিক নয়';return}
  $('md').style.display='none';cb()}};
window.unlockU=function(id){
 const go=un=>{if(un)ME.chLocked=false;const u=U(id);u.locked=false;delete u.lockedAt;sv();draw();if(un)setTimeout(()=>info('চেস্ট ফাইনালাইজ খুলে গেছে। নতুন এন্ট্রি হলে আবার চেস্ট তৈরি করে ফাইনালাইজ করুন।'),60)};
 if(isAdm()&&ME.chLocked)window.askPin('চেস্ট ফাইনালাইজড আছে। ইউনিট আনলক করতে আপনার পিন দিন।',()=>go(true));else go(false)};
/* ক্রম: ME.chOrder প্রাধান্য; না থাকলে ফাইনাল সাবমিটের সময়, তারপর নাম */
const nm=u=>String(u.name||'');
function ordered(){
 const ss=schools(ME.id),g=u=>u.locked?(u.lockedAt?1:0):2;
 const base=[...ss].sort((p,q)=>{const a=g(p),b=g(q);if(a!==b)return a-b;if(a===1&&p.lockedAt!==q.lockedAt)return p.lockedAt-q.lockedAt;return nm(p).localeCompare(nm(q))}).map(u=>u.id);
 const have=new Set(base),pre=(ME.chOrder||[]).filter(id=>have.has(id));
 return pre.concat(base.filter(id=>!pre.includes(id)))}
const B1={boys:[1,200],girls:[201,400],cult:[401,600],teach:[801,900]},B2={boys:{A:[101,200],B:[201,300],C:[301,400]},girls:{A:[401,500],B:[501,600],C:[601,700]},cult:{A:[701,800],B:[801,900]},teach:{'':[901,999]}};
const rng=x=>OPT===1?B1[x.cat]:(B2[x.cat]||{})[x.sec],key=x=>OPT===1?x.cat:x.cat+x.sec;
function plan(onlyNew){
 const parts=[];ordered().forEach(id=>DB.a.filter(x=>x.school===id).sort(window.pCmp).forEach(x=>parts.push(x)));
 const out=new Map(),cnt={},mx={};let ov=0;
 if(onlyNew)parts.forEach(x=>{if(!x.chest)return;const k=key(x),n=parseInt(String(x.chest).replace(/\D/g,''),10);if(n>(mx[k]||0))mx[k]=n});
 parts.forEach(x=>{if(onlyNew&&x.chest)return;const R=rng(x);if(!R)return;const[lo,hi]=R,k=key(x);let v;
  if(onlyNew){v=Math.max(mx[k]||0,lo-1)+1;mx[k]=v}else{cnt[k]=cnt[k]||0;v=lo+cnt[k]++}
  if(v>hi)ov++;out.set(x,(x.cat==='teach'?'T':'')+v)});
 return{out,ov,parts}}
/* প্রকাশিত ফলাফলের বিজয়ী → প্রতিযোগী (pid, না থাকলে পুরনো chest+ক্যাটাগরি+বিভাগ+ইভেন্ট) */
const matchWin=(r,w,P,old,byId)=>{
 if(w.pid!=null&&byId.has(w.pid))return byId.get(w.pid);
 const c=String(w.chest||'').trim().toUpperCase();if(!c)return null;
 const m=P.parts.filter(x=>String(old.get(x.id)||'').toUpperCase()===c&&x.cat===r.cat&&(x.sec||'')===(r.sec||'')&&(x.ev||[]).includes(r.ev));
 return m.length===1?m[0]:null};
const snap=P=>({old:new Map(P.parts.map(x=>[x.id,x.chest])),byId:new Map(P.parts.map(x=>[x.id,x]))});
window.genC=function(){
 if(!isAdm()||ME.chLocked)return info('🔒 চেস্ট ফাইনালাইজড আছে। নম্বর তৈরি করতে আগে আনলক করুন।');
 const P=plan(false);if(!P.parts.length)return info('কোনো প্রতিযোগী নেই।');
 const S=snap(P);
 const changed=P.parts.filter(x=>x.chest&&P.out.get(x)&&P.out.get(x)!==x.chest).length;
 let nw=0;DB.r.forEach(r=>r.win.forEach(w=>{const a=matchWin(r,w,P,S.old,S.byId);if(a&&P.out.get(a)&&P.out.get(a)!==String(w.chest))nw++}));
 conf('সবার চেস্ট নম্বর নতুন করে বসবে।'+(changed?'<br><b>'+changed+'জনের চেস্ট নম্বর বদলাবে।</b>':'')+(nw?'<br><b style="color:#ff8b8f">⚠ '+nw+'টি প্রকাশিত ফলাফলের চেস্ট নম্বরও নতুন নম্বরে মিলিয়ে দেওয়া হবে। ছাপা চেস্ট কার্ড আবার ছাপতে হবে।</b>':(changed?'<br>ছাপা চেস্ট কার্ড আবার ছাপতে হবে।':'')),()=>{
  P.parts.forEach(x=>{const v=P.out.get(x);if(v)x.chest=v});
  DB.r.forEach(r=>r.win.forEach(w=>{const a=matchWin(r,w,P,S.old,S.byId);if(a&&a.chest&&String(w.chest)!==String(a.chest))w.chest=a.chest}));
  sv();draw();info(P.parts.length+'টি চেস্ট নম্বর তৈরি।'+(P.ov?'<br>⚠ '+P.ov+'টি সীমা ছাড়িয়েছে':''))})};
window.genNew=function(){
 if(!isAdm()||ME.chLocked)return info('🔒 চেস্ট ফাইনালাইজড আছে। নম্বর তৈরি করতে আগে আনলক করুন।');
 const P=plan(true);if(!P.out.size)return info('সবার চেস্ট নম্বর আগেই আছে, নতুন কেউ নেই।');
 conf(P.out.size+'জন নতুন প্রতিযোগীর চেস্ট নম্বর বসবে। আগের কারও নম্বর বদলাবে না।',()=>{
  P.out.forEach((v,x)=>{x.chest=v});sv();draw();info(P.out.size+'টি নতুন চেস্ট নম্বর তৈরি।'+(P.ov?'<br>⚠ '+P.ov+'টি সীমা ছাড়িয়েছে':''))})};
window.chFin=function(){
 if(!isAdm())return;const ids=schools(ME.id).map(s=>s.id),mine=DB.a.filter(x=>ids.includes(x.school));
 if(!mine.some(x=>x.chest))return info('আগে চেস্ট নম্বর তৈরি করুন।');
